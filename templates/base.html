<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Image to Excel{% endblock %}</title>
<style>
  :root { --bg:#f9f9f7; --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
          --grid:#e1e0d9; --line:#c3c2b7; --accent:#2a78d6; --accent-ink:#ffffff; --ok:#006300; --warn:#a15c00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
            --grid:#2c2c2a; --line:#383835; --accent:#3987e5; --ok:#0ca30c; --warn:#fab219; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:20px 28px; border-bottom:1px solid var(--grid); display:flex; align-items:center; gap:14px; }
  header h1 { margin:0; font-size:20px; font-weight:650; }
  header a { color:inherit; text-decoration:none; }
  header .sub { color:var(--ink2); font-size:14px; }
  main { max-width:1180px; margin:0 auto; padding:28px; }
  .card { background:var(--surface); border:1px solid var(--grid); border-radius:12px; padding:22px 24px; margin-bottom:22px; }
  .card h2 { margin:0 0 12px; font-size:17px; }
  label { display:block; font-weight:600; margin:12px 0 6px; }
  input[type=file], select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); }
  .btn { display:inline-block; padding:10px 18px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.secondary { background:transparent; color:var(--accent); }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .flash { background:#fff3cd; color:#5c3d00; border:1px solid #ffe59a; padding:12px 14px; border-radius:8px; margin-bottom:16px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; border:1px solid var(--line); color:var(--ink2); }
  .badge.on { border-color:var(--ok); color:var(--ok); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:8px 0 4px; }
  .kpi { border:1px solid var(--grid); border-radius:10px; padding:12px 14px; }
  .kpi .l { color:var(--ink2); font-size:13px; }
  .kpi .v { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .tablewrap { overflow-x:auto; border:1px solid var(--grid); border-radius:8px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { border-bottom:1px solid var(--grid); padding:6px 10px; text-align:left; white-space:nowrap; }
  th { background:var(--bg); position:sticky; top:0; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.total td { font-weight:700; background:var(--bg); }
  .notes li { color:var(--ink2); }
  svg .axis, svg .lbl { font:12px system-ui,sans-serif; fill:var(--ink2); }
  svg .val { font:11px system-ui,sans-serif; fill:#ffffff; }
  svg .tot { font:12px system-ui,sans-serif; fill:var(--ink); font-weight:600; }
  .muted { color:var(--muted); font-size:13px; }
  code { background:var(--bg); padding:2px 6px; border-radius:4px; font-size:13px; }
  details summary { cursor:pointer; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1><a href="{{ url_for('index') }}">Image → Excel</a></h1>
  <span class="sub">Table image to spreadsheet with chart · Nepali text translated to English</span>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
